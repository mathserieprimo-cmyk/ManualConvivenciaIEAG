name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct project
        shell: bash
        run: |
          cat source_parts/part*.txt | tr -d '\n\r' | base64 -d > source.zip
          unzip -q source.zip
          test -d ManualConvivenciaIEAG
          ls -la ManualConvivenciaIEAG

      - name: Update Kotlin compiler DSL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ManualConvivenciaIEAG/app/build.gradle.kts")
          s = p.read_text()
          old = '    kotlinOptions { jvmTarget = "17" }'
          new = '''    kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }'''
          if old not in s:
              raise SystemExit("No se encontró kotlinOptions esperado")
          s = s.replace(old, new)
          s = s.replace('androidx.compose:compose-bom:2026.09.00', 'androidx.compose:compose-bom:2025.08.00')
          s = s.replace('androidx.activity:activity-compose:1.13.0', 'androidx.activity:activity-compose:1.11.0')
          p.write_text(s)
          PY
          grep -n -A5 -B2 "compilerOptions" ManualConvivenciaIEAG/app/build.gradle.kts
          grep -n "compose-bom\|activity-compose" ManualConvivenciaIEAG/app/build.gradle.kts

      - name: Build debug APK
        working-directory: ManualConvivenciaIEAG
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp ManualConvivenciaIEAG/app/build/outputs/apk/debug/app-debug.apk Manual-Convivencia-IEAG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manual-Convivencia-IEAG-APK
          path: Manual-Convivencia-IEAG.apk
          if-no-files-found: error
