name: Build Android APK v0.2

on:
  push:
    branches: [ "build-v0.2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct v0.2 project
        shell: bash
        run: |
          cat v02_parts/part*.txt | tr -d '\n\r' | base64 -d > source-v02.zip
          unzip -q source-v02.zip
          test -d ManualConvivenciaIEAG
          grep -n "versionName" ManualConvivenciaIEAG/app/build.gradle.kts

      - name: Build debug APK
        working-directory: ManualConvivenciaIEAG
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp ManualConvivenciaIEAG/app/build/outputs/apk/debug/app-debug.apk Manual-Convivencia-IEAG-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manual-Convivencia-IEAG-v0.2-APK
          path: Manual-Convivencia-IEAG-v0.2.apk
          if-no-files-found: error
