name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct project
        shell: bash
        run: |
          cat source_parts/part*.txt | tr -d '\n\r' | base64 -d > source.zip
          unzip -q source.zip
          test -d ManualConvivenciaIEAG
          ls -la ManualConvivenciaIEAG

      - name: Build debug APK
        working-directory: ManualConvivenciaIEAG
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp ManualConvivenciaIEAG/app/build/outputs/apk/debug/app-debug.apk Manual-Convivencia-IEAG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manual-Convivencia-IEAG-APK
          path: Manual-Convivencia-IEAG.apk
          if-no-files-found: error
